[project]
name = "hhoppe-tools"
description = "Library of Python tools by Hugues Hoppe"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hugues Hoppe", email="hhoppe@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = []

# pip dependencies of the project
dependencies = [
    "numpy",
]

# This is set automatically by flit using `*.__version__`
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/hhoppe/hhoppe-tools"
repository = "https://github.com/hhoppe/hhoppe-tools"
# Other: `documentation`, `changelog`

[project.optional-dependencies]
# Development deps (unittest, linting, formatting,...)
# Installed through `pip install .[dev]`
dev = [
    "matplotlib",
    "pdoc",
    "Pillow",
    "IPython",
    # "pytest",
    # "pytest-xdist",
    # "pylint>=2.6.0",
]

[build-system]
requires = ["flit_core >=3.5,<4"]
build-backend = "flit_core.buildapi"

[tool.autopep8]
indent_size = 2
ignore = "E111,E114,E121,E125,E126,E129,E226,E302,E305,E501,W504,E741,E20,W503,E731"
aggressive = 3
recursive = true
exclude = ".ipynb_checkpoints"

[tool.mypy]
ignore_missing_imports = true
strict = true
warn_return_any = false  # buggy numpy
files = ["."]
exclude = "^(Other)/"

[tool.pyink]
pyink-indentation = 2
line-length = 100  # Default is 88.
pyink-use-majority-quotes = true
# quiet = true
# verbose = true
extend-exclude = "(\\.ipynb$|^/(Other)/)"

[tool.pylint.main]
disable = [
    "fixme", "redefined-builtin", "cell-var-from-loop",
    "using-constant-test", "simplifiable-condition", "import-outside-toplevel", "line-too-long",
    "too-many-lines", "too-few-public-methods", "too-many-arguments", "too-many-locals",
    "use-dict-literal", "unnecessary-lambda-assignment",
]
reports = false
score = false
recursive = true
ignore-paths = [".*ipynb_checkpoints"]

[tool.pylint.basic]
good-names-rgxs = "^[a-z][a-z0-9]?|[A-Z]([A-Z_]*[A-Z])?$"

[tool.pylint.format]
indent-string = "  "
expected-line-ending-format = "LF"

[tool.pyrefly]
min-severity = "warn"

[tool.pyrefly.errors]
missing-import = false
redundant-condition = false
untyped-import = false

[tool.pytest.ini_options]
addopts = "--ignore-glob '*.#*' --doctest-modules"

[tool.ruff]
# indent-width = 2  # Too primitive; see below.

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "B", "C", "UP", "SIM", "RUF", "NPY", "PTH", "PERF",
    "ISC", "ICN", "PIE", "RET", "TID", "TC", "I",
]
extend-ignore = [
    "E501", "E721", "E741",
    "B010", "B028", "C408", "C901",
    "TC003", "TC006", "SIM300", "ICN001", "RET504",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?)|unused_.*)$"

[tool.ruff.format]
# The command "ruff format --diff" is too primitive.
# It does not support 4-space indent inside parentheses/brackets/braces.
# quote-style = "single"
